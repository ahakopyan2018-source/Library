<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibraryApp - Auth</title>
  <style>
    :root {
      --bg-color: #0b0d14;
      --surface-color: #151823;
      --card-bg: rgba(21, 24, 35, 0.85);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.1);
      --radius: 14px;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    body.light-theme {
      --bg-color: #f1f5f9;
      --surface-color: #ffffff;
      --card-bg: rgba(255, 255, 255, 0.9);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: rgba(0, 0, 0, 0.1);
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', sans-serif; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Top bar for language & theme */
    .top-controls {
      position: absolute;
      top: 20px;
      right: 24px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .lang-dropdown-container, .user-menu-container {
      position: relative;
      display: inline-block;
    }

    .lang-dropdown-btn, .theme-toggle-btn {
      background: var(--surface-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: var(--radius);
      outline: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .lang-dropdown-btn:hover, .theme-toggle-btn:hover { background: rgba(99, 102, 241, 0.1); }

    .dropdown-menu {
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 6px;
      background: var(--surface-color);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 150px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 1100;
    }
    .dropdown-menu.show { display: flex; }

    .dropdown-item {
      padding: 10px 14px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.2s, color 0.2s;
      display: block;
      border: none;
      background: none;
      text-align: left;
      width: 100%;
      cursor: pointer;
    }
    .dropdown-item:hover { background: rgba(99, 102, 241, 0.15); color: var(--primary); }

    /* Auth Card Container */
    .auth-container {
      width: 100%;
      max-width: 440px;
      background: var(--surface-color);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px;
      box-shadow: var(--shadow);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header h2 { font-size: 1.5rem; margin-bottom: 6px; }
    .auth-header p { color: var(--text-muted); font-size: 0.9rem; }

    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .auth-tab {
      flex: 1;
      background: none;
      border: none;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      position: relative;
    }
    .auth-tab.active { color: var(--primary); }
    .auth-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--primary);
    }

    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-main);
      outline: none;
      font-size: 0.95rem;
    }
    .form-control:focus { border-color: var(--primary); }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
    }
    .back-link:hover { color: var(--primary); }

    .alert {
      padding: 10px 14px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      font-size: 0.88rem;
      display: none;
    }
    .alert-error { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .alert-success { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }

    .form-section { display: none; }
    .form-section.active { display: block; }
  </style>
</head>
<body>

  <!-- Top Controls (Language & Theme) -->
  <div class="top-controls">
    <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()" title="Փոխել լուսավորությունը">☀️</button>
    <div class="lang-dropdown-container">
      <button id="langDropdownBtn" class="lang-dropdown-btn" onclick="toggleLangMenu(event)">🇦🇲 HY ▾</button>
      <div class="dropdown-menu" id="langDropdownMenu">
        <button class="dropdown-item" onclick="changeLanguage('hy')">🇦🇲 Հայերեն</button>
        <button class="dropdown-item" onclick="changeLanguage('en')">🇬🇧 English</button>
        <button class="dropdown-item" onclick="changeLanguage('ru')">🇷🇺 Русский</button>
      </div>
    </div>
  </div>

  <div class="auth-container">
    <div class="auth-header">
      <h2>📚 LibraryApp</h2>
      <p id="authSubtitle">Մուտք գործեք կամ գրանցվեք համակարգում</p>
    </div>

    <div id="alertBanner" class="alert"></div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLoginBtn" onclick="switchTab('login')">Մուտք</button>
      <button class="auth-tab" id="tabRegisterBtn" onclick="switchTab('register')">Գրանցում</button>
    </div>

    <!-- Login Form -->
    <div id="loginSection" class="form-section active">
      <form id="loginForm">
        <div class="form-group">
          <label id="lblLoginEmail">Էլ. փոստ (Email)</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="example@mail.am" required>
        </div>
        <div class="form-group">
          <label id="lblLoginPass">Գաղտնաբառ</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary" id="btnLoginSubmit">Մուտք գործել</button>
      </form>
    </div>

    <!-- Register Form -->
    <div id="registerSection" class="form-section">
      <form id="registerForm">
        <div class="form-group">
          <label id="lblRegName">Անուն</label>
          <input type="text" id="regName" class="form-control" placeholder="Անուն Ազգանուն" required>
        </div>
        <div class="form-group">
          <label id="lblRegEmail">Էլ. փոստ (Email)</label>
          <input type="email" id="regEmail" class="form-control" placeholder="example@mail.am" required>
        </div>
        <div class="form-group">
          <label id="lblRegPass">Գաղտնաբառ</label>
          <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary" id="btnRegSubmit">Գրանցվել</button>
      </form>
    </div>

    <a href="index.html" class="back-link" id="backHomeLink">← Վերադառնալ գլխավոր էջ</a>
  </div>

  <script>
    const STORAGE_KEY = 'library_app_books_v13';
    const USERS_KEY = 'library_registered_users';
    const SESSION_KEY = 'library_logged_user';
    const LANG_KEY = 'library_lang';
    const THEME_KEY = 'library_theme';

    let currentLang = localStorage.getItem(LANG_KEY) || 'hy';
    let isLangMenuOpen = false;

    // Translations for Auth Page
    const translations = {
      hy: {
        subtitle: 'Մուտք գործեք կամ գրանցվեք համակարգում',
        tabLogin: 'Մուտք',
        tabRegister: 'Գրանցում',
        lblEmail: 'Էլ. փոստ (Email)',
        lblPass: 'Գաղտնաբառ',
        lblName: 'Անուն',
        btnLogin: 'Մուտք գործել',
        btnReg: 'Գրանցվել',
        backHome: '← Վերադառնալ գլխավոր էջ',
        langLabel: '🇦🇲 HY ▾',
        errInvalid: 'Սխալ էլ. փոստ կամ գաղտնաբառ:',
        errExists: 'Այս էլ. փոստով օգտատեր արդեն գրանցված է:',
        successReg: 'Գրանցումը հաջողվեց! Խնդրում ենք մուտք գործել:'
      },
      en: {
        subtitle: 'Log in or register in the system',
        tabLogin: 'Login',
        tabRegister: 'Register',
        lblEmail: 'Email Address',
        lblPass: 'Password',
        lblName: 'Full Name',
        btnLogin: 'Log In',
        btnReg: 'Register',
        backHome: '← Back to Home Page',
        langLabel: '🇬🇧 EN ▾',
        errInvalid: 'Invalid email or password.',
        errExists: 'User with this email already exists.',
        successReg: 'Registration successful! Please log in.'
      },
      ru: {
        subtitle: 'Войдите или зарегистрируйтесь в системе',
        tabLogin: 'Вход',
        tabRegister: 'Регистрация',
        lblEmail: 'Эл. почта (Email)',
        lblPass: 'Пароль',
        lblName: 'Имя',
        btnLogin: 'Войти',
        btnReg: 'Зарегистрироваться',
        backHome: '← Назад на главную страницу',
        langLabel: '🇷🇺 RU ▾',
        errInvalid: 'Неверный email или пароль.',
        errExists: 'Пользователь с таким email уже существует.',
        successReg: 'Регистрация успешна! Пожалуйста, войдите.'
      }
    };

    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_KEY);
      if (savedTheme === 'light') document.body.classList.add('light-theme');
      updateThemeBtnIcon();
    }

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark');
      updateThemeBtnIcon();
    }

    function updateThemeBtnIcon() {
      const btn = document.getElementById('themeToggleBtn');
      if (btn) btn.textContent = document.body.classList.contains('light-theme') ? '🌙' : '☀️';
    }

    function toggleLangMenu(event) {
      event.stopPropagation();
      isLangMenuOpen = !isLangMenuOpen;
      document.getElementById('langDropdownMenu').classList.toggle('show', isLangMenuOpen);
    }

    window.addEventListener('click', () => {
      isLangMenuOpen = false;
      const menu = document.getElementById('langDropdownMenu');
      if (menu) menu.classList.remove('show');
    });

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem(LANG_KEY, lang);
      isLangMenuOpen = false;
      document.getElementById('langDropdownMenu').classList.remove('show');
      updateTexts();
    }

    function updateTexts() {
      const t = translations[currentLang];
      document.getElementById('authSubtitle').textContent = t.subtitle;
      document.getElementById('tabLoginBtn').textContent = t.tabLogin;
      document.getElementById('tabRegisterBtn').textContent = t.tabRegister;
      
      document.getElementById('lblLoginEmail').textContent = t.lblEmail;
      document.getElementById('lblLoginPass').textContent = t.lblPass;
      document.getElementById('btnLoginSubmit').textContent = t.btnLogin;

      document.getElementById('lblRegName').textContent = t.lblName;
      document.getElementById('lblRegEmail').textContent = t.lblEmail;
      document.getElementById('lblRegPass').textContent = t.lblPass;
      document.getElementById('btnRegSubmit').textContent = t.btnReg;

      document.getElementById('backHomeLink').textContent = t.backHome;
      document.getElementById('langDropdownBtn').textContent = t.langLabel;
    }

    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
      
      if (tab === 'login') {
        document.getElementById('tabLoginBtn').classList.add('active');
        document.getElementById('loginSection').classList.add('active');
      } else {
        document.getElementById('tabRegisterBtn').classList.add('active');
        document.getElementById('registerSection').classList.add('active');
      }
    }

    function showAlert(message, type = 'error') {
      const banner = document.getElementById('alertBanner');
      banner.className = `alert alert-${type}`;
      banner.textContent = message;
      banner.style.display = 'block';
      setTimeout(() => { banner.style.display = 'none'; }, 4000);
    }

    // Login Handler
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const t = translations[currentLang];
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();

      if (email === 'admin@example.com' && pass === 'admin') {
        const adminUser = { name: 'Administrator', email: 'admin@example.com' };
        localStorage.setItem(SESSION_KEY, JSON.stringify(adminUser));
        window.location.href = 'admin.html';
        return;
      }

      const users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
      const user = users.find(u => u.email === email && u.password === pass);

      if (user) {
        localStorage.setItem(SESSION_KEY, JSON.stringify(user));
        window.location.href = 'index.html';
      } else {
        showAlert(t.errInvalid, 'error');
      }
    });

    // Register Handler
    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const t = translations[currentLang];
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass = document.getElementById('regPassword').value.trim();

      let users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
      if (users.some(u => u.email === email)) {
        showAlert(t.errExists, 'error');
        return;
      }

      users.push({ name, email, password: pass });
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
      showAlert(t.successReg, 'success');
      e.target.reset();
      setTimeout(() => switchTab('login'), 1500);
    });

    // Initialize
    initTheme();
    updateTexts();
  </script>
</body>
</html>
