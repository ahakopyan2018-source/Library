<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Օգտատիրոջ Պրոֆիլ - LibraryApp</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --surface-color: #1e293b;
      --card-bg: rgba(30, 41, 59, 0.75);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.1);
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    body.light-theme {
      --bg-color: #f1f5f9;
      --surface-color: #ffffff;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: rgba(0, 0, 0, 0.1);
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', sans-serif; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
      transition: background-color 0.3s ease, color 0.3s ease;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
    }

    .navbar {
      background: var(--surface-color);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 16px 0;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--text-main);
      text-decoration: none;
      background: linear-gradient(135deg, var(--primary), var(--success));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-right-group {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-links a:hover, .nav-links a.active { color: var(--primary); }

    .theme-toggle-btn, .lang-dropdown-btn {
      background: var(--surface-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: var(--radius);
      outline: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .theme-toggle-btn:hover, .lang-dropdown-btn:hover { background: rgba(99, 102, 241, 0.1); }

    .lang-dropdown-container, .user-menu-container {
      position: relative;
      display: inline-block;
    }

    .dropdown-menu {
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 6px;
      background: var(--surface-color);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 160px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 1100;
    }

    .dropdown-menu.show { display: flex; }

    .dropdown-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
      background: rgba(99, 102, 241, 0.05);
    }

    .dropdown-item {
      padding: 12px 16px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.2s, color 0.2s;
      display: block;
      border: none;
      background: none;
      text-align: left;
      width: 100%;
      cursor: pointer;
    }

    .dropdown-item:hover { background: rgba(99, 102, 241, 0.15); color: var(--primary); }
    .dropdown-item.danger:hover { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

    .user-icon-btn {
      width: 40px;
      height: 40px;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-main);
      transition: background 0.3s, transform 0.2s;
    }
    .user-icon-btn:hover { background: rgba(99, 102, 241, 0.4); transform: scale(1.05); }

    .container {
      max-width: 900px;
      margin: 40px auto 0;
      padding: 0 20px;
    }

    .page-header { text-align: center; margin-bottom: 32px; }
    .page-header h1 { font-size: 2.5rem; margin-bottom: 8px; }
    .page-header p { color: var(--text-muted); font-size: 1rem; }

    .profile-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow);
      margin-bottom: 30px;
    }

    .profile-info-group {
      margin-bottom: 16px;
    }
    .profile-info-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 4px;
    }
    .profile-info-group span {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .section-title {
      font-size: 1.4rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .borrowed-books-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .borrowed-book-item {
      background: var(--surface-color);
      border: 1px solid var(--border);
      padding: 18px;
      border-radius: var(--radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    button { padding: 10px 18px; border: none; border-radius: var(--radius); font-weight: 600; cursor: pointer; }
    .btn-warning { background-color: var(--warning); color: white; }
    .btn-secondary { background-color: #475569; color: white; }

    .alert {
      padding: 14px 18px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      display: none;
      font-weight: 500;
    }
    .alert-success { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">📚 LibraryApp</a>
      <div class="nav-right-group">
        <ul class="nav-links">
          <li><a href="index.html" id="navHome">Գլխավոր</a></li>
          <li><a href="about.html" id="navAbout">Մեր Մասին</a></li>
        </ul>
        <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()" title="Փոխել լուսավորությունը">☀️</button>
        
        <!-- Custom Language Dropdown -->
        <div class="lang-dropdown-container">
          <button id="langDropdownBtn" class="lang-dropdown-btn" onclick="toggleLangMenu(event)">🇦🇲 HY ▾</button>
          <div class="dropdown-menu" id="langDropdownMenu">
            <button class="dropdown-item" onclick="changeLanguage('hy')">🇦🇲 Հայերեն</button>
            <button class="dropdown-item" onclick="changeLanguage('en')">🇬🇧 English</button>
            <button class="dropdown-item" onclick="changeLanguage('ru')">🇷🇺 Русский</button>
          </div>
        </div>

        <div id="authNavItem"></div>
      </div>
    </div>
  </nav>

  <div class="container">
    <header class="page-header">
      <h1 id="profileHeaderTitle">👤 Օգտատիրոջ Պրոֆիլ</h1>
      <p id="profileHeaderSub">Ձեր անձնական տվյալները և ամրագրված գրքերը</p>
    </header>

    <div id="alertBanner" class="alert"></div>

    <div class="profile-card">
      <div class="profile-info-group">
        <label id="lblName">Անուն</label>
        <span id="profileUserName">-</span>
      </div>
      <div class="profile-info-group">
        <label id="lblEmail">Էլ. փոստ</label>
        <span id="profileUserEmail">-</span>
      </div>
    </div>

    <h3 class="section-title" id="myBooksTitle">📖 Իմ ամրագրված գրքերը</h3>
    <div id="userBorrowedBooksList" class="borrowed-books-list"></div>
    <div id="noBooksMessage" style="display:none; text-align:center; padding: 30px; color: var(--text-muted);" id="noBooksText">Դուք դեռևս ամրագրված գրքեր չունեք:</div>
  </div>

  <script>
    const STORAGE_KEY = 'library_app_books_v5';
    const SESSION_KEY = 'library_logged_user';
    const LANG_KEY = 'library_lang';
    const THEME_KEY = 'library_theme';

    let currentLang = localStorage.getItem(LANG_KEY) || 'hy';
    let currentUser = null;
    let books = [];
    let isLangMenuOpen = false;
    let isMenuOpen = false;

    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_KEY);
      if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
      }
      updateThemeBtnIcon();
    }

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark');
      updateThemeBtnIcon();
    }

    function updateThemeBtnIcon() {
      const btn = document.getElementById('themeToggleBtn');
      if (btn) {
        const isLight = document.body.classList.contains('light-theme');
        btn.textContent = isLight ? '🌙' : '☀️';
      }
    }

    const translations = {
      hy: {
        navHome: 'Գլխավոր',
        navAbout: 'Մեր Մասին',
        profileHeaderTitle: '👤 Օգտատիրոջ Պրոֆիլ',
        profileHeaderSub: 'Ձեր անձնական տվյալները և ամրագրված գրքերը',
        lblName: 'Անուն',
        lblEmail: 'Էլ. փոստ',
        myBooksTitle: '📖 Իմ ամրագրված գրքերը',
        noBooksText: 'Դուք դեռևս ամրագրված գրքեր չունեք:',
        returnBtn: 'Վերադարձնել',
        successReturn: 'Գիրքը հաջողությամբ վերադարձվեց:',
        adminLink: '⚙️ Ադմին Վահանակ',
        profileLink: '👤 Պրոֆիլ',
        logoutBtn: '🚪 Դուրս գալ',
        loginBtn: 'Մուտք',
        until: 'Մինչև՝',
        langBtnLabel: '🇦🇲 HY ▾'
      },
      en: {
        navHome: 'Home',
        navAbout: 'About Us',
        profileHeaderTitle: '👤 User Profile',
        profileHeaderSub: 'Your personal information and borrowed books',
        lblName: 'Name',
        lblEmail: 'Email',
        myBooksTitle: '📖 My Borrowed Books',
        noBooksText: 'You have no borrowed books yet.',
        returnBtn: 'Return',
        successReturn: 'Book successfully returned!',
        adminLink: '⚙️ Admin Panel',
        profileLink: '👤 Profile',
        logoutBtn: '🚪 Logout',
        loginBtn: 'Login',
        until: 'Until:',
        langBtnLabel: '🇬🇧 EN ▾'
      },
      ru: {
        navHome: 'Главная',
        navAbout: 'О нас',
        profileHeaderTitle: '👤 Профиль Пользователя',
        profileHeaderSub: 'Ваши личные данные и забронированные книги',
        lblName: 'Имя',
        lblEmail: 'Эл. почта',
        myBooksTitle: '📖 Мои забронированные книги',
        noBooksText: 'У вас пока нет забронированных книг.',
        returnBtn: 'Вернуть',
        successReturn: 'Книга успешно возвращена!',
        adminLink: '⚙️ Админ Панель',
        profileLink: '👤 Профиль',
        logoutBtn: '🚪 Выйти',
        loginBtn: 'Вход',
        until: 'До:',
        langBtnLabel: '🇷🇺 RU ▾'
      }
    };

    function toggleLangMenu(event) {
      event.stopPropagation();
      const menu = document.getElementById('langDropdownMenu');
      const userMenu = document.getElementById('dropdownMenu');
      if (userMenu) userMenu.classList.remove('show');
      isLangMenuOpen = !isLangMenuOpen;
      if (isLangMenuOpen) menu.classList.add('show');
      else menu.classList.remove('show');
    }

    function toggleUserMenu(event) {
      event.stopPropagation();
      const menu = document.getElementById('dropdownMenu');
      const langMenu = document.getElementById('langDropdownMenu');
      if (langMenu) langMenu.classList.remove('show');
      isMenuOpen = !isMenuOpen;
      if (isMenuOpen) menu.classList.add('show');
      else menu.classList.remove('show');
    }

    function handleMouseEnter() {
      const menu = document.getElementById('dropdownMenu');
      if (menu) menu.classList.add('show');
    }

    function handleMouseLeave() {
      if (!isMenuOpen) {
        const menu = document.getElementById('dropdownMenu');
        if (menu) menu.classList.remove('show');
      }
    }

    window.addEventListener('click', (e) => {
      const langContainer = document.querySelector('.lang-dropdown-container');
      const langMenu = document.getElementById('langDropdownMenu');
      if (langContainer && !langContainer.contains(e.target)) {
        isLangMenuOpen = false;
        if (langMenu) langMenu.classList.remove('show');
      }

      const container = document.querySelector('.user-menu-container');
      const menu = document.getElementById('dropdownMenu');
      if (container && !container.contains(e.target)) {
        isMenuOpen = false;
        if (menu) menu.classList.remove('show');
      }
    });

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem(LANG_KEY, lang);
      isLangMenuOpen = false;
      document.getElementById('langDropdownMenu').classList.remove('show');
      updateTexts();
      renderProfile();
    }

    function updateTexts() {
      const t = translations[currentLang];
      document.getElementById('navHome').textContent = t.navHome;
      document.getElementById('navAbout').textContent = t.navAbout;
      document.getElementById('profileHeaderTitle').textContent = t.profileHeaderTitle;
      document.getElementById('profileHeaderSub').textContent = t.profileHeaderSub;
      document.getElementById('lblName').textContent = t.lblName;
      document.getElementById('lblEmail').textContent = t.lblEmail;
      document.getElementById('myBooksTitle').textContent = t.myBooksTitle;
      document.getElementById('noBooksMessage').textContent = t.noBooksText;
      document.getElementById('langDropdownBtn').textContent = t.langBtnLabel;

      initSession();
    }

    function initSession() {
      const session = localStorage.getItem(SESSION_KEY);
      if (session) {
        try { currentUser = JSON.parse(session); } catch(e) { currentUser = null; }
      }

      if (!currentUser) {
        window.location.href = 'auth.html';
        return;
      }

      document.getElementById('profileUserName').textContent = currentUser.name || '-';
      document.getElementById('profileUserEmail').textContent = currentUser.email || '-';

      const t = translations[currentLang];
      const authNavItem = document.getElementById('authNavItem');
      const isAdmin = currentUser.email === 'admin@example.com';
      const profileLink = isAdmin ? 'admin.html' : 'userprofile.html';
      const profileText = isAdmin ? t.adminLink : t.profileLink;

      authNavItem.innerHTML = `
        <div class="user-menu-container" onmouseenter="handleMouseEnter()" onmouseleave="handleMouseLeave()">
          <div class="user-icon-btn" onclick="toggleUserMenu(event)" title="${currentUser.name || 'User'}">👤</div>
          <div class="dropdown-menu" id="dropdownMenu">
            <div class="dropdown-header">${currentUser.name || 'User'}</div>
            <a href="${profileLink}" class="dropdown-item">${profileText}</a>
            <button class="dropdown-item danger" onclick="logout()">${t.logoutBtn}</button>
          </div>
        </div>
      `;
    }

    function logout() {
      localStorage.removeItem(SESSION_KEY);
      window.location.href = 'index.html';
    }

    function loadBooks() {
      const stored = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('library_app_books');
      if (stored) {
        try { books = JSON.parse(stored); } catch(e) { books = []; }
      }
    }

    function showAlert(message, type = 'success') {
      const banner = document.getElementById('alertBanner');
      banner.className = `alert alert-${type}`;
      banner.textContent = message;
      banner.style.display = 'block';
      setTimeout(() => { banner.style.display = 'none'; }, 4000);
    }

    function returnBook(id) {
      loadBooks();
      const book = books.find(b => b.id === id);
      if (book) {
        book.status = 'Available';
        book.borrower = '';
        book.borrowerEmail = '';
        book.borrowDate = '';
        book.dueDate = '';
        localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
        renderProfile();
        showAlert(translations[currentLang].successReturn, 'success');
      }
    }

    function renderProfile() {
      loadBooks();
      const t = translations[currentLang];
      const listContainer = document.getElementById('userBorrowedBooksList');
      const noBooksMsg = document.getElementById('noBooksMessage');
      listContainer.innerHTML = '';

      if (!currentUser) return;

      const userBooks = books.filter(b => b.status === 'Borrowed' && (b.borrowerEmail === currentUser.email || b.borrower === currentUser.name));

      if (userBooks.length === 0) {
        noBooksMsg.style.display = 'block';
        return;
      } else {
        noBooksMsg.style.display = 'none';
      }

      userBooks.forEach(book => {
        const item = document.createElement('div');
        item.className = 'borrowed-book-item';
        const titleDisplay = book.title[currentLang] || book.title.hy;
        const authorDisplay = book.author[currentLang] || book.author.hy;

        item.innerHTML = `
          <div>
            <h4 style="margin-bottom: 4px;">${titleDisplay}</h4>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px;">✍️ ${authorDisplay}</p>
            <p style="font-size: 0.85rem; color: var(--warning);">📅 ${t.until} ${new Date(book.dueDate).toLocaleDateString()}</p>
          </div>
          <button class="btn-warning" onclick="returnBook('${book.id}')">${t.returnBtn}</button>
        `;
        listContainer.appendChild(item);
      });
    }

    initTheme();
    initSession();
    updateTexts();
    renderProfile();
  </script>
</body>
</html>
